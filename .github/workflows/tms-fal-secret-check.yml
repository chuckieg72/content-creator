name: TMS FAL connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rockstar-manager
    env:
      FAL_KEY: ${{ secrets.FAL_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secret availability without printing it
        run: |
          if [ -z "${FAL_KEY:-}" ]; then
            echo "::error::FAL_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi
          echo "FAL_KEY is present in the runtime. The key value was not printed."
          echo "No fal.ai request or model generation was made."
      - name: Run manager health check
        run: npm run check
      - name: Run manager demo
        run: npm run demo
